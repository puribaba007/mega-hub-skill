<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mega Hub banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="0.55" stop-color="#3b1d73"/>
      <stop offset="1" stop-color="#6c3bff"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Arial,sans-serif;fill:#fff}
      .n{font-weight:800}
      .s{fill:#d9ccff}
      .c{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;fill:#fff}
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- decorative dots -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="1060" cy="70" r="120"/>
    <circle cx="150" cy="300" r="90"/>
  </g>

  <!-- hub emoji + title -->
  <text class="t n" x="70" y="140" font-size="78">🧰 Mega Hub</text>
  <text class="t s" x="74" y="188" font-size="27">One Claude skill for every task — it routes to the right tool.</text>

  <!-- stat chips -->
  <g transform="translate(74,224)">
    <g>
      <rect width="196" height="62" rx="14" fill="url(#chip)"/>
      <text class="c" x="20" y="30" font-size="26">300+</text>
      <text class="s" x="20" y="50" font-size="15" font-family="Segoe UI,Arial">skills</text>
    </g>
    <g transform="translate(212,0)">
      <rect width="196" height="62" rx="14" fill="url(#chip)"/>
      <text class="c" x="20" y="30" font-size="26">140+</text>
      <text class="s" x="20" y="50" font-size="15" font-family="Segoe UI,Arial">connectors</text>
    </g>
    <g transform="translate(424,0)">
      <rect width="196" height="62" rx="14" fill="url(#chip)"/>
      <text class="c" x="20" y="30" font-size="26">140+</text>
      <text class="s" x="20" y="50" font-size="15" font-family="Segoe UI,Arial">plugins</text>
    </g>
    <g transform="translate(636,0)">
      <rect width="220" height="62" rx="14" fill="url(#chip)"/>
      <text class="c" x="20" y="30" font-size="26">140+</text>
      <text class="s" x="20" y="50" font-size="15" font-family="Segoe UI,Arial">free AI tools</text>
    </g>
  </g>
</svg>
